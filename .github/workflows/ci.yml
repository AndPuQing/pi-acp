name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint + test across the three target platforms (decision 4: Win/Mac/Linux).
  lint-test:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # W-484 real-chain acceptance provisions its harness env itself, but
      # needs Node on PATH plus a real `pi` binary (template install runs
      # `pi install npm:pi-mcp-adapter@<pin>`). Without these the new tests
      # skip loudly instead of proving anything — CI must provide them.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install pi for MCP real-chain acceptance
        run: npm install -g @earendil-works/pi-coding-agent@0.85.0

      - name: test
        # Integration fixtures spawn nested pi-acp processes; serialize test
        # binaries and cases so runner process limits cannot cause EAGAIN or
        # close an otherwise healthy ACP transport.
        run: cargo test --all --all-features -j 1 -- --test-threads=1

  # Cross-compile smoke check (no execution, no C linker — `cargo check` for
  # every target in the release matrix: Linux x64/arm64 (musl), macOS x64/arm64,
  # Windows x64). Catches target-specific `cfg`/platform breakage fast.
  cross-compile:
    name: cross-compile check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
      - name: check ${{ matrix.target }}
        run: cargo check --target ${{ matrix.target }}
