[package]
name = "pi-acp"
description = "ACP (Agent Client Protocol) adapter for the pi coding agent, written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "pi-acp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
agent-client-protocol.workspace = true
agent-client-protocol-schema.workspace = true
tokio.workspace = true
# home-dir / agent-dir resolution (settings.rs, commands.rs)
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
# Integration tests (the S2 e2e spike client) drive the `pi-acp` binary as an
# ACP client; they need the same crates at the same versions as the lib.
agent-client-protocol.workspace = true
agent-client-protocol-schema.workspace = true
tokio.workspace = true
# Unit tests for commands.rs / settings.rs build fixtures in temp dirs.
tempfile.workspace = true
