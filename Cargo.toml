[workspace]
resolver = "2"
members = ["crates/pi-acp"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AndPuQing/pi-acp"
authors = ["PuQing <me@puqing.work>"]
rust-version = "1.85"

[workspace.dependencies]
# --- ACP (Agent Client Protocol) — first-party SDK (S2 spike, W-449) ---
# SDK locked to 2.0.x; schema pinned to the exact version the SDK requires so
# there is a single schema copy in the dependency tree (type identity matters
# between the re-exported `agent_client_protocol::schema` and a direct dep).
agent-client-protocol = "2.0.0"
# Same pinned schema version as the SDK (single copy in the dep tree, W-449
# constraint 1); `unstable_auth_methods` unlocks the terminal auth method
# (AuthMethod::Terminal) the ACP `authMethods` registry shape needs (S6).
agent-client-protocol-schema = { version = "=1.5.0", features = ["unstable_auth_methods"] }
# --- async runtime (S2 spike validated + locked tokio, W-449 / decision D9) ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "signal"] }
# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- error handling ---
thiserror = "2"
anyhow = "1"
# --- logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# --- misc ---
dirs = "6"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1