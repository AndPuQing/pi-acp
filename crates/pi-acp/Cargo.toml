[package]
name = "pi-acp"
description = "ACP (Agent Client Protocol) adapter for the pi coding agent, written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# ACP protocol v2 (unstable draft) has no cargo feature: one binary serves both
# versions, negotiated in `initialize` by the SDK's `AgentProtocolRouter`. Both
# protocol implementations are always compiled.

[[bin]]
name = "pi-acp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
# `unstable_protocol_v2` is enabled unconditionally: pi-acp always compiles both
# protocol implementations and the negotiated version picks one at runtime.
agent-client-protocol = { workspace = true, features = ["unstable_protocol_v2"] }
agent-client-protocol-schema = { workspace = true, features = ["unstable_protocol_v2"] }
tokio.workspace = true
# home-dir / agent-dir resolution (settings.rs, commands.rs)
dirs.workspace = true
# Git --patch text for a native v2 `Diff` (v1 carries old/new text, which v2
# replaced with structured changes plus a renderable patch).
diffy = "0.5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
# Integration tests (the S2 e2e spike client) drive the `pi-acp` binary as an
# ACP client; they need the same crates at the same versions as the lib.
agent-client-protocol.workspace = true
agent-client-protocol-schema.workspace = true
tokio.workspace = true
# Unit tests for commands.rs / settings.rs build fixtures in temp dirs.
tempfile.workspace = true
